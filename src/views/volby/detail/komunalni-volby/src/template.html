<div class="election-item">
	<template v-if="data.list[0].radne === 1">
		<p-block headline="Rozcestník" :hide="true">
			<search-town :elections="data.list[0].status > 1 ? data.list[0].id : null" :link="'/volby/komunalni-volby/' + data.list[0].id + '/obec/'"></search-town>

			<p-area borderColor="var(--blue)" class="mt1">
				<strong class="smaller">Rychlý rozcestník</strong>				
				<div class="smaller mt1">
					<p-list-linear class="nebo">
						<span v-for="(town, index) in [].concat(enums.towns.capital, enums.towns.regional)">
							<router-link :to="'/volby/komunalni-volby/' + data.list[0].id + '/obec/' + town.num" class="is-span">{{ town.name }}</router-link>
						</span>
					</p-list-linear>
				</div>
				<template v-if="data.list[0].id === 176">
					<div class="p-gap _05"></div>
					<p-collapsible label="Okresy" class="smaller" logo="party">
						<p-columns class="_tight">
							<div v-for="okres in sortBy(data.cis.okresy.filter(x => x.numnuts % 10 !== 0 && x.datum === '2025-10-15'), 'nazev', null, true)">
								<router-link :to="'/volby/komunalni-volby/' + data.list[0].id + '/okres/' + (okres.numnuts === 1199 ? 1100 : okres.numnuts)">
									{{ okres.nazev }}
								</router-link>							
							</div>
						</p-columns>
					</p-collapsible>
					<p-collapsible label="Na mapě" logo="map" class="smaller">
						<hero-map size="mid"></hero-map>
					</p-collapsible>
					<div class="p-gap _1"></div>
					<p-box-group>
						<p-box to="/jak-volit/komunalni-volby">
							<p-box-button class="primary">Jak volit?</p-box-button>
						</p-box>
					</p-box-group>
				</template>
			</p-area>			
		</p-block>
		<p-block headline="Aktivita stran" :hide="true" v-if="parties">
			<!-- <div class="p-line _2"></div> -->
			<!-- <p-area> -->
				<strong>Aktivita stran</strong>
				<p class="smaller">Někde samostatně, jinde v koalici, někde jen podporují jinou kandidátku, někde ve spolupráci s místními sdruženími a jinde vůbec. Podívejte se na aktivitu stran ve volbách.</p>
				<!-- <div class="p-gap _05"></div> -->
				<p-box-group>
					<template v-for="party in sortBy(parties.list, 'ZKRATKA', null, true)">
						<p-box :to="'/volby/komunalni-volby/' + data.list[0].id + '/aktivita/' + party.VSTRANA">
							<p-box-image :src="logoByItem(party, {cis: {strany: parties.list}})" class="_r"></p-box-image>
						</p-box>
					</template>
					<p-box :to="'/volby/komunalni-volby/' + data.list[0].id + '/strany'">
						<p-box-button>Přehled stran</p-box-button>
					</p-box>
					<p-modal>
						<template #init>
							<p-box>
								<p-box-button icon="detail.svg">jiná strana</p-box-button>
							</p-box>
						</template>
						<template #content>
							<search-party :link="'/volby/komunalni-volby/' + data.list[0].id + '/aktivita/'"></search-party>
						</template>
					</p-modal>
				</p-box-group>
				<!-- <div class="p-gap"></div>
				<p-collapsible label="Souhrnné výsledky stran" logo="results">

				</p-collapsible> -->
			<!-- <div class="p-line _2"></div> -->
			<!-- </p-area> -->
		</p-block>
	</template>
	<p-block headline="V největších městech">
		<template v-for="(item, index) in data.list[0].$dotcene.filter(x => x.DRUHZASTUP === 4).filter(x => !x.OBVODY || x.OBVODY < 2)">
			<town-item :data="town(item.obec)" :town="item.obec" :id="data.list[0].id" :hasColumns="1"></town-item>
		</template>
		<h3 class="quando mt3">Krajská města</h3>
		<p-columns class="_noGap _noRule">
			<template v-for="(item, index) in data.list[0].$dotcene.filter(x => enums.towns.regional.find(y => y.num === x.obec)).filter(x => !x.OBVODY || x.OBVODY < 2)">
				<!-- <template v-if="index != 0"> -->
					<div>
						<town-item :data="town(item.obec)" :town="item.obec" :id="data.list[0].id"></town-item>
					</div>
				<!-- </template> -->
			</template>
		</p-columns>
		<h3 class="quando mt3">Další velká města</h3>
		<p-columns class="_noGap _noRule">
			<template v-for="(item, index) in data.list[0].$dotcene.filter(x => enums.towns.other.find(y => y.num === x.obec)).filter(x => !x.OBVODY || x.OBVODY < 2)">
				<!-- <template v-if="index != 0"> -->
					<div>
						<town-item :data="town(item.obec)" :town="item.obec" :id="data.list[0].id"></town-item>
					</div>
				<!-- </template> -->
			</template>
		</p-columns>
		<template v-if="data.list[0].id === 176">
			<div class="p-line"></div>
			<p-box to="/volby/komunalni-volby/176/stav-pred-volbami">
				<p-box-button icon="map">Stav před volbami</p-box-button>
			</p-box>
		</template>
	</p-block>
	<div class="p-gap"></div>
	<template v-if="data.list[0].$otazky && data.list[0].$otazky.length > 0">
		<p-block headline="Otázky a odpovědi" :hide="true" class="mb3">
			<p-area class="primary" borderColor="var(--yellow)" icon="answers-mini">
				<h2 class="serif mt0">Otázky a odpovědi</h2>
				<template v-for="(qitem, qindex) in qenum">
					<p-collapsible :label="qitem.label" :status="data.list[0].$otazky.filter(x => x.type === qitem.type && qitem.designee === x.designated).length" v-if="data.list[0].$otazky.filter(x => x.type === qitem.type && qitem.designee === x.designated).length > 0">
						<p-area>
							<p-list>
								<div v-for="(qquestion, qqindex) in data.list[0].$otazky.filter(x => x.type === qitem.type && x.priority === 1 && qitem.designee === x.designated)">
									<!-- <p-area> -->
										<router-link class="strong" :to="'/volby/evropske-volby/' + data.list[0].id + '/' + qitem.hash + '/' + qquestion.id">{{ qquestion.question }}</router-link>
										<div class="smaller" v-if="qquestion.comment">{{ truncate(qquestion.comment, 12) }}</div>
									<!-- </p-area> -->
								</div>
							</p-list>
							<template v-if="data.list[0].$otazky.find(x => x.type === qitem.type && x.priority === 2)">
								<div class="p-gap"></div>
								<p-collapsible label="Doplňkové otázky">
									<div :class="qitem.type < 3 ? 'columns' : 'p-list'">
										<div v-for="(qquestion, qqindex) in data.list[0].$otazky.filter(x => x.type === qitem.type && x.priority === 2 && qitem.designee === x.designated)">
											<router-link :to="'/volby/evropske-volby/' + data.list[0].id + '/' + qitem.hash + '/' + qquestion.id">{{ qquestion.question }}</router-link>
										</div>
									</div>
								</p-collapsible>
							</template>
						</p-area>
					</p-collapsible>
				</template>
						<template v-if="data.list[0].editace === 1">
							<p-modal class="mt2">
								<template #init>
									<p-box>
										<p-box-button icon="warning">Chcete také doplnit odpovědi?</p-box-button>
									</p-box>
								</template>
								<template #content>
									<strong>Kandidujete a chcete také zaslat odpovědi?</strong>
									<p-list class="smaller _05 pt2">
										<div>
											Nejlépe tak uděláte pomocí <strong>Adminu</strong>. Ještě nemáte přístup? <p-link href="https://admin.programydovoleb.cz" class="strong">Získejte ho zde</p-link>
										</div>
										<div>
											V Adminu můžete doplnit fotku, priority, představení a další...
										</div>
										<div>
											Pokud máte stranický e-mail, můžete své odpovědi poslat přímo na <a href="mailto:odpovedi@programydovoleb.cz">odpovedi@programydovoleb.cz</a>
										</div>
										<div>
											Posledním dnem, kdy lze odpovědi zaslat, je <strong>středa 7. října</strong>.
										</div>
									</p-list>
								</template>
							</p-modal>
						</template>
			</p-area>
		</p-block>
	</template>
</div>
