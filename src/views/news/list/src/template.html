<div class="layout-polls">
	<p-layout-simple>
			<p-block headline="Zprávy od projektu Programy do voleb" :level="1" anchor="Novinky">
				<p class="lead">10 nejnovějších zpráv, novinek na webu, oznámení, tiskových zpráv, apod. Níže pak najdete přehled po jednotlivých letech a typech zpráv.</p>
						<p-loader :rule="news">
							<p-area class="highlight shadow _2 maxw40 ma">
								<p-list v-if="news" class="">
									<template v-for="(item, index) in news.sys">
										<news-item :data="item"></news-item>
									</template>
									<div>
										<p-label color="var(--red)" class="strong smallest"><p-link href="https://programydovoleb.cz/rss">Odebírat jako RSS</p-link></p-label>
									</div>
								</p-list>
							</p-area>
						</p-loader>
			</p-block>
			<p-block :level="1" headline="Archiv">
				<p class="lead">Zde najdete všechny zprávy a komentáře, rozdělené podle typu.</p>
				<div class="maxw40 ma">
					<template v-for="(year, iyear) in [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019]">
						<p-block-expandable :headline="String(year)">
							<news-year :year="year"></news-year>
						</p-block-expandable>
					</template>
				</div>
			</p-block>
		<!-- </template> -->
		
	</p-layout-simple>
</div>
