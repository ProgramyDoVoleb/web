<div class="p-block" :class="'_' + (level || 2)" :name="hash" :data-anchor="anchor || headline" :data-level="level || 2">
	<p-headline :level="level || 2" :anchor="anchor" :alert="alert" :class="{'_hide': hide}">
		<div class="_label">{{ headline }}</div>
		<div class="_sublabel">{{ subheadline }}</div>
	</p-headline>
	<slot />
</div>
