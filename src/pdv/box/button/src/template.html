<div class="p-box-button" :style="{color, background, 'border-color': color}" :class="{'p-box-button---full': full, 'p-box---icon': icon}">
  <template v-if="(logo || icon) && (logo || icon).includes('http')">
    <img loading="lazy" :src="logo || icon" class="_logo">
  </template>
  <template v-if="(logo || icon) && !(logo || icon).includes('http')">
    <img loading="lazy" :src="cdn + 'icon/' + icon + (!icon.includes('.') ? '.svg' : '')" v-if="icon" class="_icon">
    <img loading="lazy" :src="cdn + 'logo/' + logo" v-if="logo" class="_logo">
  </template>  
  <span>
    <slot />
  </span>
</div>
